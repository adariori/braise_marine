    <path d="M -20,45 C 10,60 40,60 70,45" stroke="#D64531" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -60,-30 L -60,30 M -25,-40 L -25,40 M 10,-42 L 10,42 M 45,-35 L 45,35" stroke="#D64531" stroke-width="4" opacity="0.55" stroke-linecap="round"/>
  </g>
  <text x="200" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F9F6F0" opacity="0.85">Poisson Braisé</text>
