      <stop offset="0%" stop-color="#0B6E4F"/>
      <stop offset="100%" stop-color="#0d8a63"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg1)"/>
  <!-- braises -->
  <g opacity="0.25">
    <circle cx="60" cy="330" r="14" fill="#E8A837"/>
    <circle cx="100" cy="345" r="9" fill="#D64531"/>
    <circle cx="330" cy="335" r="12" fill="#D64531"/>
  </g>
  <!-- grille -->
  <g stroke="#2D2A26" stroke-width="4" opacity="0.35">
    <line x1="40" y1="300" x2="360" y2="300"/>
    <line x1="40" y1="320" x2="360" y2="320"/>
    <line x1="40" y1="340" x2="360" y2="340"/>
  </g>
  <!-- poisson -->
  <g transform="translate(200,190)">
